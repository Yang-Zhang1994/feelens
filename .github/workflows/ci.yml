name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Production build (fails if a bundle exceeds its size budget)
        run: npx ng build
      - name: Unit tests
        run: npx ng test --watch=false
      - run: npx playwright install --with-deps chromium
      - name: End-to-end, accessibility and performance tests (desktop + mobile)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx ng build --base-href /feelens/
      # GitHub Pages has no SPA fallback; serving index.html as the 404 page keeps deep links working.
      - run: cp dist/feelens/browser/index.html dist/feelens/browser/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/feelens/browser
      - id: deployment
        uses: actions/deploy-pages@v4
